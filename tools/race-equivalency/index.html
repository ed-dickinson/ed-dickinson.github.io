<script>
dom = {

  output : document.querySelector('output'),
}

const convertToMins = (s, option) => {

  let mins = Math.floor(s / 60)
  let secs = Math.round(s % 60)

  if (secs < 10) {
    secs = '0' + secs
  }
  let output
  let time_limit = (option && option === 'half') ? 70 : 60
  if (mins >= time_limit) {
    let hours = Math.floor(mins / 60)
    mins = mins % 60
    if (mins < 10) {
      mins = '0' + mins
    }
    output = hours + ':' + mins + '.' + secs
  } else {
    output = mins + '.' + secs
  }

  return output
}

const convertDecimalToSeconds = (value) => {
  return Math.floor(value)
}

const riegel = (time1, dist1, dist2) => {
  let constant_b = 1.06

  let time2 = time1 * Math.pow(dist2 / dist1, constant_b)
  return time2
}

const riegelPace = (time1, dist1, dist2) => {
  let time2 = riegel(time1, dist1, dist2)

  let pace = (time2 / (dist2 / 1609.344))

  return pace
}

const doConversion = () => {

      </td></tr>
  </table>`

  let ftp = time1 * 0.347 // is this acc?
  let lthr = 165

  let calc = (input) => {

    let diff = input - 100

    let output = 1 + ((diff * diff) / 1100) + (diff / 180)
    return output
  }

//   dom.output_threshold.innerHTML = `Threshold Pace (FTP): ${convertToMins(ftp)}

//     <tr><th>HR:</th><td>

//
