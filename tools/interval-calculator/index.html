<!doctype html>
<html>
<head>
<title>Interval Calculator</title>
<meta charset="UTF-8">
<meta name="keywords" content="running, pace, converter, miles, km, min/mile, interval, calculator, intervals, session, time, run">
<meta name="description" content="A tool to work out how far and long an interval session will be.">
<meta name="author" content="Ed Dickinson">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png">
<link rel="stylesheet" type="text/css" href="../../stylesheets/running-tools.css"/>
<style>


body {
  text-align: center;
}
#input-pace, #output-pace {
  display: inline-block;
  text-align: left;

}
.big {
  font-size: 1.5em;
}
#input-cont, #output-cont {
  display: inline-block;
}
#input-cont {
  margin-top: 2em;
}
#divider {
  font-size: 3.5em;
}
table {
  margin: auto;
  padding-left: 3em;
}
tr td:nth-of-type(1) {
  text-align: right;
  padding-right: 1em;
}
tr td:nth-of-type(2) {
  text-align: left;
}

.output {
  margin-bottom: 1em;
}
/* .slidecontainer {
  width: 150px;
} */

/* The slider itself */
.slider {
  width: 20em;
  /* margin-top: 4em; */
  /* max-width: 26em; */
  -webkit-appearance: none;  /* Override default CSS styles */
  appearance: none;
  height: 40px; /* Specified height */
  background: black;
  outline: none; /* Remove outline */
  opacity: 1; /* Set transparency (for mouse-over effects on hover) */
  -webkit-transition: .2s; /* 0.2 seconds transition on hover */
  transition: opacity .2s;
  border: 1px solid black;
  border-radius: 22px;
  z-index: 1;
}

/* Mouse-over effects */
.slider:hover {
  opacity: 1; /* Fully shown on mouse-over */
}

/* The slider handle (use -webkit- (Chrome, Opera, Safari, Edge) and -moz- (Firefox) to override default look) */
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; /* Override default look */
  appearance: none;
  width: 40px; /* Set a specific slider handle width */
  height: 40px; /* Slider handle height */
  background: white; /* Green background */
  border: 0px solid black;
  cursor: pointer; /* Cursor on hover */
  border-radius: 20px; z-index: 2;
}

.slider::-moz-range-thumb {
  width: 40px; /* Set a specific slider handle width */
  height: 40px; /* Slider handle height */
  /* background: dodgerblue; */
  cursor: pointer; /* Cursor on hover */
  z-index: 2;
  border-radius: 20px;
  border: 0px solid black;
}

@media only screen and (min-width: 800px) {
  .slider {
    height: 20px; /* Specified height */
    border-radius: 11px;
    z-index: 1;
  }
  .slider::-moz-range-thumb {
    width: 20px; /* Set a specific slider handle width */
    height: 20px;
  }
  .slider::-webkit-slider-thumb {
    width: 20px; /* Set a specific slider handle width */
    height: 20px; /* Slider handle height */
    border-radius: 10px;
    border: 0px solid black;
  }
}

/* mobile */
@media only screen and (max-width: 600px) {

  input {
    position: relative;
    top: 20px;
  }
  input + .output {
    position: relative;
    top: -50px;
    height: 1em;
  }
  input + .output .big {
    font-size: 1em;
  }
}





</style>

</head>
<body class="pink-purple">

  <h1>Interval Calculator</h1>

<input id="input-intervals" class="slider" type="range" min="1" max="20" value="10" step="1" /><div class="output">
  Intervals: <span id="output-intervals">#</span>
</div>


<input id="input-distance" class="slider" type="range" min="0" max="10" value="3" step="1" />
<div class="output">
Distance: <span id="output-distance">#</span>
</div>

<input id="input-float" class="slider" type="range" min="0" max="180" value="0" step="30" />
<div class="output">
Float: <span id="output-float">#</span>
</div>

<input id="input-pace" class="slider" type="range" min="240" max="420" value="300" step="1" />
<div class="output">
Est. pace: <span id="output-pace" class="big">#</span> min/mile
</div>


Total:
<div id="output-total">#</div>




<footer>
  <div id="see-also">
    <a href='https://ed-dickinson.net' >Home</a>

    <a href="../week-planner">Week Plan</a>

  </div>
</footer>



<script>
dom = {
  input_int : document.querySelector('#input-intervals'),
  output_int : document.querySelector('#output-intervals'),
  input_distance : document.querySelector('#input-distance'),
  output_distance : document.querySelector('#output-distance'),
  input_float : document.querySelector('#input-float'),
  output_float : document.querySelector('#output-float'),
  input_pace : document.querySelector('#input-pace'),
  output_pace : document.querySelector('#output-pace'),

  output_total : document.querySelector('#output-total'),
}

const convertToMins = (s, option) => {

  let mins = Math.floor(s / 60)
  let secs = Math.round(s % 60)

  if (secs < 10) {
    secs = '0' + secs
  }
  let output
  let time_limit = (option && option === 'half') ? 70 : 60
  if (mins >= time_limit) {
    let hours = Math.floor(mins / 60)
    mins = mins % 60
    if (mins < 10) {
      mins = '0' + mins
    }
    output = hours + ':' + mins + '.' + secs
  } else {
    output = mins + '.' + secs
  }

  return output
}

const convertDecimalToSeconds = (value) => {
  return Math.floor(value)
}

const floatCalc = (value) => {
  return [0.25, 0.5, 1, 2][value]
}

const calcMins = (s, option) => {

  let mins = Math.floor(s / 60)
  let secs = Math.round(s % 60)

  if (secs < 10) {
    secs = '0' + secs
  }
  if (option) {
    if (option === 'mins') {
      return Math.round(mins)

      // return mins > 60 ? `${Math.floor(60/mins)+1}hr ${mins%60}mins`: mins
    }
  }
  return mins + ':' + secs
}

let km = 0.6213712

const distances = [
  ['&#x00BC;mi', 0.25],
  ['&#x00BD;mi', 0.5],
  ['1k', 1 * km],
  ['1mi', 1],
  ['2km', 2 * km],
  ['3km', 3 * km],
  ['2mi', 2],
  ['4km', 4 * km],
  ['3mi', 3],
  ['5km', 5 * km],
  ['4mi', 4]
]

const doCalc = () => {

  let mi = 0.6213712

  dom.output_int.innerHTML = dom.input_int.value

  let distance_value = distances[dom.input_distance.value]
  let distance = distance_value[1]
  dom.output_distance.innerHTML = distance_value[0]

  let float = Number(dom.input_float.value)
  dom.output_float.innerHTML = float <= 90 ? float + 's' : (float / 60) % 1 == 0.5 ? Math.floor(float/60) + '&#x00BD; min' : float/60 + ' min'

  let pace = dom.input_pace.value
  dom.output_pace.innerHTML = calcMins(pace)

  let float_pace = 600

  let on_dist = dom.input_int.value * distance
  let off_dist = dom.input_int.value * (float / float_pace)

  // tm is time in s
  let tm = calcMins((on_dist * pace) + (float * dom.input_int.value), 'mins')
  // console.log(tm)


  dom.output_total.innerHTML = `<span class="big">${(on_dist + off_dist).toFixed(1)}</span>mi, in ~`

  if (tm > 60) {
    dom.output_total.innerHTML += `<span class="big">${Math.floor(60/tm)+1}</span>hr<span class="big">${Math.floor(tm%60)}</span>mins`
  } else {
    dom.output_total.innerHTML += `<span class="big">${tm}</span>mins`
  }

}
doCalc()


dom.input_int.addEventListener('input', ()=> {
  event.preventDefault()
  doCalc()
})
dom.input_distance.addEventListener('input', ()=> {
  event.preventDefault()
  doCalc()
})
dom.input_float.addEventListener('input', ()=> {
  event.preventDefault()
  doCalc()
})
dom.input_pace.addEventListener('input', ()=> {
  event.preventDefault()
  doCalc()
})



</script>
<script type='module' src='../../scripts/running-tools-menu.js'></script>

</body>
</html>
